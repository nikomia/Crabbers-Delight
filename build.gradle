plugins {
	id 'net.neoforged.moddev' version "${moddev_version}"
}

version = project.mod_version
base {
	archivesName = 'crabbersdelight-neoforge'
}

repositories {
	maven {
		name = "BlameJared (JEI)"
		url = "https://maven.blamejared.com/"
	}
}

neoForge {
	version = project.neoforge_version

	runs {
		server {
			server()
			programArgument '--nogui'
		}
	}

	mods {
		"${mod_id}" {
			sourceSet(sourceSets.main)
		}
	}
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

configurations {
	localRuntime
	runtimeClasspath.extendsFrom localRuntime
}

dependencies {
	compileOnly files('../libs/FarmersDelight-26.3-1.3.3.jar')
	// Only for local runs (runServer), not bundled
	localRuntime files('../libs/FarmersDelight-26.3-1.3.3.jar')

	compileOnly "mezz.jei:jei-${jei_minecraft}-common-api:${jei_version}"
	compileOnly "mezz.jei:jei-${jei_minecraft}-neoforge-api:${jei_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version
	filesMatching("META-INF/neoforge.mods.toml") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = 'UTF-8'
	it.options.release = 25
	it.options.compilerArgs += ['-Xmaxerrs', '5000']
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}
